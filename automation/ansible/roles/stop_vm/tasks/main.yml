---
- name: Check that a VM name was provided
  ansible.builtin.assert:
    that:
      - vm_name | length > 0
    fail_msg: "vm_name is required."

- name: Query VM state
  ansible.builtin.command:
    argv:
      - "{{ vboxmanage_bin }}"
      - showvminfo
      - "{{ vm_name }}"
      - --machinereadable
  register: vm_info
  changed_when: false

- name: Request graceful shutdown if it is running
  ansible.builtin.command:
    argv:
      - "{{ vboxmanage_bin }}"
      - controlvm
      - "{{ vm_name }}"
      - acpipowerbutton
  when: "'VMState=\"running\"' in vm_info.stdout"
  changed_when: true

- name: Wait for the VM to be powered off
  ansible.builtin.command:
    argv:
      - "{{ vboxmanage_bin }}"
      - showvminfo
      - "{{ vm_name }}"
      - --machinereadable
  register: vm_state
  changed_when: false
  until: "'VMState=\"poweroff\"' in vm_state.stdout"
  retries: "{{ vm_shutdown_retries }}"
  delay: "{{ vm_shutdown_delay }}"
  when: "'VMState=\"running\"' in vm_info.stdout"
