---
- name: Check that a VM name was provided
  ansible.builtin.assert:
    that:
      - vm_name | length > 0
    fail_msg: "vm_name is required."

- name: Query VM state
  ansible.builtin.command:
    argv:
      - "{{ vboxmanage_bin }}"
      - showvminfo
      - "{{ vm_name }}"
      - --machinereadable
  register: vm_info
  changed_when: false

- name: Start VM if it is not running
  ansible.builtin.command:
    argv:
      - "{{ vboxmanage_bin }}"
      - startvm
      - "{{ vm_name }}"
      - --type
      - "{{ vm_start_type }}"
  when: "'VMState=\"running\"' not in vm_info.stdout"
  changed_when: true
