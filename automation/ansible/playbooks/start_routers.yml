---
- name: Start VirtualCorp routers
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Apply start role to each router
      ansible.builtin.include_role:
        name: start_vm
      vars:
        vm_name: "{{ router_vm }}"
      loop: "{{ routers }}"
      loop_control:
        loop_var: router_vm
